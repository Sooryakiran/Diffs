<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diffs by Soorkie</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --add-bg: #12261e;
      --add-word-bg: #2ea04370;
      --del-bg: #2d1214;
      --del-word-bg: #f8514970;
      --line-num: #484f58;
      --accent: #58a6ff;
      --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 svg { color: var(--accent); }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select, button {
      font-family: inherit;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      padding: 5px 10px;
      cursor: pointer;
      outline: none;
    }

    select:hover, button:hover { border-color: var(--text-muted); }

    .btn-swap {
      background: transparent;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
    }

    .btn-swap:hover { color: var(--text); }

    .btn-clear {
      background: transparent;
      color: var(--text-muted);
    }

    .btn-clear:hover { color: #f85149; }

    .diff-stats {
      font-size: 12px;
      color: var(--text-muted);
    }

    .diff-stats .adds { color: #3fb950; font-weight: 600; margin-right: 8px; }
    .diff-stats .dels { color: #f85149; font-weight: 600; }

    .identical-badge {
      color: #3fb950;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Main editor area */
    .editor-area {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .panes {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
      min-width: 0;
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .pane:first-child { border-right: 1px solid var(--border); }

    .pane-header {
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .dot-left {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #f85149;
    }

    .dot-right {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #3fb950;
    }

    .editor-scroll {
      flex: 1;
      overflow: auto;
    }

    /* Minimap */
    .minimap {
      width: 80px;
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .minimap canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .minimap .minimap-viewport {
      position: absolute;
      left: 0;
      width: 100%;
      background: rgba(200, 200, 200, 0.12);
      border-top: 1px solid rgba(200, 200, 200, 0.2);
      border-bottom: 1px solid rgba(200, 200, 200, 0.2);
      pointer-events: none;
      min-height: 12px;
    }

    .minimap .minimap-divider {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--border);
      pointer-events: none;
    }

    .editor-container {
      display: flex;
      min-height: 100%;
    }

    .gutter {
      flex-shrink: 0;
      width: 48px;
      padding: 8px 0;
      text-align: right;
      user-select: none;
      pointer-events: none;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 20px;
      color: var(--line-num);
      background: var(--bg);
    }

    .gutter .ln {
      display: block;
      padding-right: 12px;
      height: 20px;
    }

    .gutter .ln.ln-add { background: var(--add-bg); }
    .gutter .ln.ln-del { background: var(--del-bg); }

    .code-wrap {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    .code-wrap textarea {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 20px;
      color: transparent;
      caret-color: var(--text);
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      white-space: pre;
      overflow: hidden;
      tab-size: 2;
      z-index: 2;
    }

    .code-wrap .highlight-layer {
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 20px;
      white-space: pre;
      color: var(--text);
      pointer-events: none;
      min-height: 100%;
      z-index: 1;
    }

    .highlight-layer .hl-line {
      display: block;
      height: 20px;
      margin: 0 -12px;
      padding: 0 12px;
    }

    .highlight-layer .hl-line.hl-add { background: var(--add-bg); }
    .highlight-layer .hl-line.hl-del { background: var(--del-bg); }

    .highlight-layer .word-add {
      background: var(--add-word-bg);
      border-radius: 3px;
    }

    .highlight-layer .word-del {
      background: var(--del-word-bg);
      border-radius: 3px;
    }

    .highlight-layer .hl-line.hl-blank {
      visibility: hidden;
    }

    /* hljs overrides */
    .highlight-layer .hljs { background: transparent; padding: 0; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    @media (max-width: 768px) {
      .panes { grid-template-columns: 1fr; }
      .pane:first-child { border-right: none; border-bottom: 1px solid var(--border); }
      .minimap { width: 50px; }
    }
  </style>
</head>
<body>

<header>
  <h1>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 3v18M3 12h18M8 8l-4 4 4 4M16 8l4 4-4 4"/>
    </svg>
    Diffs by Soorkie
  </h1>
  <div class="controls">
    <select id="langSelect">
      <option value="">Auto-detect</option>
      <option value="javascript">JavaScript</option>
      <option value="typescript">TypeScript</option>
      <option value="python">Python</option>
      <option value="java">Java</option>
      <option value="csharp">C#</option>
      <option value="cpp">C++</option>
      <option value="go">Go</option>
      <option value="rust">Rust</option>
      <option value="ruby">Ruby</option>
      <option value="php">PHP</option>
      <option value="swift">Swift</option>
      <option value="kotlin">Kotlin</option>
      <option value="html">HTML</option>
      <option value="css">CSS</option>
      <option value="scss">SCSS</option>
      <option value="json">JSON</option>
      <option value="xml">XML</option>
      <option value="yaml">YAML</option>
      <option value="toml">TOML</option>
      <option value="sql">SQL</option>
      <option value="bash">Bash</option>
      <option value="powershell">PowerShell</option>
      <option value="dockerfile">Dockerfile</option>
      <option value="markdown">Markdown</option>
      <option value="plaintext">Plain Text</option>
    </select>
    <button class="btn-swap" onclick="swapPanes()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16l-4-4 4-4M17 8l4 4-4 4M3 12h18"/></svg>
      Swap
    </button>
    <button class="btn-clear" onclick="clearAll()">Clear</button>
    <div class="diff-stats" id="stats"></div>
  </div>
</header>

<div class="editor-area">
  <div class="panes">
    <div class="pane">
      <div class="pane-header"><span class="dot-left"></span> Original (Baseline)</div>
      <div class="editor-scroll" id="leftScroll">
        <div class="editor-container">
          <div class="gutter" id="leftGutter"></div>
          <div class="code-wrap">
            <div class="highlight-layer" id="leftHL"></div>
            <textarea id="leftInput" placeholder="Paste original text here..." spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="pane">
      <div class="pane-header"><span class="dot-right"></span> Modified</div>
      <div class="editor-scroll" id="rightScroll">
        <div class="editor-container">
          <div class="gutter" id="rightGutter"></div>
          <div class="code-wrap">
            <div class="highlight-layer" id="rightHL"></div>
            <textarea id="rightInput" placeholder="Paste modified text here..." spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="minimap" id="minimap">
    <canvas id="minimapCanvas"></canvas>
    <div class="minimap-viewport" id="minimapVP"></div>
    <div class="minimap-divider"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.2.0/diff.min.js"></script>
<script>
  const leftInput = document.getElementById('leftInput');
  const rightInput = document.getElementById('rightInput');
  const leftHL = document.getElementById('leftHL');
  const rightHL = document.getElementById('rightHL');
  const leftGutter = document.getElementById('leftGutter');
  const rightGutter = document.getElementById('rightGutter');
  const leftScroll = document.getElementById('leftScroll');
  const rightScroll = document.getElementById('rightScroll');
  const statsEl = document.getElementById('stats');
  const langSelect = document.getElementById('langSelect');

  let debounceTimer = null;

  // Minimap state (populated by compare, used by updateMinimaps)
  let lastLeftInfo = {};
  let lastRightInfo = {};

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function highlightLine(code, lang) {
    if (!code) return '';
    if (lang && lang !== 'plaintext') {
      try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
    }
    try { return hljs.highlightAuto(code).value; } catch (e) {}
    return escapeHtml(code);
  }

  // Merge word-diff background markers into syntax-highlighted HTML.
  // Walks through the HTML tracking text character positions and inserts
  // <span class="word-..."> wrappers at the right spots, closing and
  // reopening around existing HTML tags so nesting stays valid.
  function insertWordMarkers(syntaxHtml, ranges, cssClass) {
    if (!ranges.length) return syntaxHtml;
    let out = '', textPos = 0, rIdx = 0, inside = false;

    function openIfNeeded() {
      if (!inside && rIdx < ranges.length && textPos >= ranges[rIdx][0]) {
        out += '<span class="' + cssClass + '">';
        inside = true;
      }
    }
    function closeIfNeeded() {
      if (inside && rIdx < ranges.length && textPos >= ranges[rIdx][1]) {
        out += '</span>';
        inside = false;
        rIdx++;
        openIfNeeded(); // next range might start immediately
      }
    }

    for (let i = 0; i < syntaxHtml.length;) {
      if (syntaxHtml[i] === '<') {
        // HTML tag — copy as-is, close/reopen word span around it
        if (inside) out += '</span>';
        const end = syntaxHtml.indexOf('>', i);
        out += syntaxHtml.substring(i, end + 1);
        i = end + 1;
        if (inside) out += '<span class="' + cssClass + '">';
      } else if (syntaxHtml[i] === '&') {
        openIfNeeded();
        const semi = syntaxHtml.indexOf(';', i);
        if (semi !== -1 && semi - i < 8) {
          out += syntaxHtml.substring(i, semi + 1);
          i = semi + 1;
        } else {
          out += syntaxHtml[i];
          i++;
        }
        textPos++;
        closeIfNeeded();
      } else {
        openIfNeeded();
        out += syntaxHtml[i];
        i++;
        textPos++;
        closeIfNeeded();
      }
    }
    if (inside) out += '</span>';
    return out;
  }

  function computeWordDiff(oldLine, newLine, lang) {
    const diff = Diff.diffWordsWithSpace(oldLine, newLine);

    // Compute character ranges that changed on each side
    const oldRanges = [], newRanges = [];
    let oPos = 0, nPos = 0;
    diff.forEach(part => {
      if (part.removed) {
        oldRanges.push([oPos, oPos + part.value.length]);
        oPos += part.value.length;
      } else if (part.added) {
        newRanges.push([nPos, nPos + part.value.length]);
        nPos += part.value.length;
      } else {
        oPos += part.value.length;
        nPos += part.value.length;
      }
    });

    // Syntax highlight both full lines, then overlay word-diff markers
    const oldSyntax = highlightLine(oldLine, lang) || escapeHtml(oldLine);
    const newSyntax = highlightLine(newLine, lang) || escapeHtml(newLine);

    return {
      oldHtml: insertWordMarkers(oldSyntax, oldRanges, 'word-del'),
      newHtml: insertWordMarkers(newSyntax, newRanges, 'word-add')
    };
  }

  function scheduleCompare() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(compare, 100);
  }

  function compare() {
    const left = leftInput.value;
    const right = rightInput.value;
    const lang = langSelect.value;

    if (!left && !right) {
      leftHL.innerHTML = '';
      rightHL.innerHTML = '';
      leftGutter.innerHTML = '';
      rightGutter.innerHTML = '';
      statsEl.innerHTML = '';
      lastLeftInfo = {};
      lastRightInfo = {};
      fitTextareas();
      updateMinimaps();
      return;
    }

    if (left === right) {
      const lines = left.split('\n');
      let lH = '', rH = '', lG = '', rG = '';
      lines.forEach((line, i) => {
        const n = i + 1;
        const hl = highlightLine(line, lang) || ' ';
        lH += '<span class="hl-line">' + hl + '</span>';
        rH += '<span class="hl-line">' + hl + '</span>';
        lG += '<span class="ln">' + n + '</span>';
        rG += '<span class="ln">' + n + '</span>';
      });
      leftHL.innerHTML = lH;
      rightHL.innerHTML = rH;
      leftGutter.innerHTML = lG;
      rightGutter.innerHTML = rG;
      statsEl.innerHTML = '<span class="identical-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Identical</span>';
      lastLeftInfo = {};
      lastRightInfo = {};
      fitTextareas();
      updateMinimaps();
      return;
    }

    const changes = Diff.diffLines(left, right);

    const rawLines = [];
    let lNum = 0, rNum = 0;
    changes.forEach(ch => {
      if (ch.value === '') return;
      const cls = ch.value.replace(/\n$/, '').split('\n');
      cls.forEach(line => {
        if (ch.added) { rNum++; rawLines.push({ type: 'add', content: line, rNum }); }
        else if (ch.removed) { lNum++; rawLines.push({ type: 'del', content: line, lNum }); }
        else { lNum++; rNum++; rawLines.push({ type: 'eq', content: line, lNum, rNum }); }
      });
    });

    // Pair consecutive del/add runs for word-level highlighting
    const paired = [];
    let i = 0;
    while (i < rawLines.length) {
      if (rawLines[i].type === 'del') {
        const dels = [], adds = [];
        while (i < rawLines.length && rawLines[i].type === 'del') { dels.push(rawLines[i]); i++; }
        while (i < rawLines.length && rawLines[i].type === 'add') { adds.push(rawLines[i]); i++; }
        const maxL = Math.max(dels.length, adds.length);
        for (let j = 0; j < maxL; j++) {
          const d = j < dels.length ? dels[j] : null;
          const a = j < adds.length ? adds[j] : null;
          if (d && a) {
            const wd = computeWordDiff(d.content, a.content, lang);
            paired.push({ type: 'pair', del: { ...d, html: wd.oldHtml }, add: { ...a, html: wd.newHtml } });
          } else if (d) {
            paired.push({ type: 'del', ...d, html: highlightLine(d.content, lang) || escapeHtml(d.content) });
          } else {
            paired.push({ type: 'add', ...a, html: highlightLine(a.content, lang) || escapeHtml(a.content) });
          }
        }
      } else if (rawLines[i].type === 'add') {
        paired.push({ type: 'add', ...rawLines[i], html: highlightLine(rawLines[i].content, lang) || escapeHtml(rawLines[i].content) });
        i++;
      } else {
        paired.push({ type: 'eq', ...rawLines[i] });
        i++;
      }
    }

    // The left textarea has `left` text — its lines map 1:1 to left line numbers.
    // The right textarea has `right` text — its lines map 1:1 to right line numbers.
    // We need to build highlight layers that match the textarea content exactly
    // (one hl-line per actual text line) so the overlay aligns.

    const leftLines = left.split('\n');
    const rightLines = right.split('\n');

    // Build maps: lineNumber -> diff info
    const leftInfo = {};  // lNum -> { type: 'del'|'pair'|'eq', html? }
    const rightInfo = {}; // rNum -> { type: 'add'|'pair'|'eq', html? }

    let addCount = 0, delCount = 0;
    paired.forEach(entry => {
      if (entry.type === 'pair') {
        addCount++; delCount++;
        leftInfo[entry.del.lNum] = { type: 'del', html: entry.del.html };
        rightInfo[entry.add.rNum] = { type: 'add', html: entry.add.html };
      } else if (entry.type === 'del') {
        delCount++;
        leftInfo[entry.lNum] = { type: 'del', html: entry.html };
      } else if (entry.type === 'add') {
        addCount++;
        rightInfo[entry.rNum] = { type: 'add', html: entry.html };
      } else {
        leftInfo[entry.lNum] = { type: 'eq' };
        rightInfo[entry.rNum] = { type: 'eq' };
      }
    });

    // Render left highlight layer (matches textarea lines exactly)
    let lH = '', lG = '';
    leftLines.forEach((line, idx) => {
      const num = idx + 1;
      const info = leftInfo[num];
      if (info && info.type === 'del') {
        lH += '<span class="hl-line hl-del">' + (info.html || ' ') + '</span>';
        lG += '<span class="ln ln-del">' + num + '</span>';
      } else {
        const hl = highlightLine(line, lang) || ' ';
        lH += '<span class="hl-line">' + hl + '</span>';
        lG += '<span class="ln">' + num + '</span>';
      }
    });

    // Render right highlight layer
    let rH = '', rG = '';
    rightLines.forEach((line, idx) => {
      const num = idx + 1;
      const info = rightInfo[num];
      if (info && info.type === 'add') {
        rH += '<span class="hl-line hl-add">' + (info.html || ' ') + '</span>';
        rG += '<span class="ln ln-add">' + num + '</span>';
      } else {
        const hl = highlightLine(line, lang) || ' ';
        rH += '<span class="hl-line">' + hl + '</span>';
        rG += '<span class="ln">' + num + '</span>';
      }
    });

    leftHL.innerHTML = lH;
    rightHL.innerHTML = rH;
    leftGutter.innerHTML = lG;
    rightGutter.innerHTML = rG;
    statsEl.innerHTML = '<span class="adds">+' + addCount + '</span><span class="dels">−' + delCount + '</span>';

    // Save info for minimaps
    lastLeftInfo = leftInfo;
    lastRightInfo = rightInfo;

    fitTextareas();
    updateMinimaps();
  }

  function fitTextareas() {
    [leftInput, rightInput].forEach(ta => {
      const wrap = ta.parentElement;
      const hl = wrap.querySelector('.highlight-layer');
      const scrollEl = ta.closest('.editor-scroll');
      const neededH = Math.max(ta.scrollHeight, hl.offsetHeight, scrollEl.clientHeight);
      ta.closest('.editor-container').style.minHeight = neededH + 'px';
    });
  }

  // Sync scroll
  let syncing = false;
  [leftScroll, rightScroll].forEach((el, i) => {
    el.addEventListener('scroll', () => {
      if (syncing) return;
      syncing = true;
      const other = i === 0 ? rightScroll : leftScroll;
      other.scrollTop = el.scrollTop;
      other.scrollLeft = el.scrollLeft;
      requestAnimationFrame(() => { syncing = false; });
    });
  });

  function swapPanes() {
    const tmp = leftInput.value;
    leftInput.value = rightInput.value;
    rightInput.value = tmp;
    compare();
  }

  function clearAll() {
    leftInput.value = '';
    rightInput.value = '';
    compare();
  }

  // Tab support
  document.querySelectorAll('textarea').forEach(ta => {
    ta.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = ta.selectionStart, end = ta.selectionEnd;
        ta.value = ta.value.substring(0, s) + '  ' + ta.value.substring(end);
        ta.selectionStart = ta.selectionEnd = s + 2;
        scheduleCompare();
      }
    });
  });

  // ── Minimap (shared, right side) ──
  const minimapCanvas = document.getElementById('minimapCanvas');
  const minimapVP = document.getElementById('minimapVP');
  const minimapEl = document.getElementById('minimap');

  const LINE_H = 3;
  const CHAR_W = 0.5;
  const CODE_COLOR = 'rgba(139, 148, 158, 0.45)';
  const ADD_COLOR = '#2ea043';
  const DEL_COLOR = '#f85149';
  const ADD_BG_MM = 'rgba(46, 160, 67, 0.2)';
  const DEL_BG_MM = 'rgba(248, 81, 73, 0.2)';

  function renderMinimap() {
    const dpr = window.devicePixelRatio || 1;
    const rect = minimapCanvas.parentElement.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;
    minimapCanvas.width = w * dpr;
    minimapCanvas.height = h * dpr;
    minimapCanvas.style.width = w + 'px';
    minimapCanvas.style.height = h + 'px';

    const ctx = minimapCanvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    const leftLines = leftInput.value.split('\n');
    const rightLines = rightInput.value.split('\n');
    const totalLines = Math.max(leftLines.length, rightLines.length);
    if (!totalLines) return;

    const halfW = w / 2;
    const scale = Math.min(LINE_H, h / totalLines);

    // Draw left half
    leftLines.forEach((line, idx) => {
      const num = idx + 1;
      const y = idx * scale;
      const inf = lastLeftInfo[num];
      const lineLen = Math.min(line.length, 60);

      if (inf && inf.type === 'del') {
        ctx.fillStyle = DEL_BG_MM;
        ctx.fillRect(0, y, halfW, Math.max(scale, 1));
        ctx.fillStyle = DEL_COLOR;
      } else {
        ctx.fillStyle = CODE_COLOR;
      }

      if (lineLen > 0) {
        const indent = line.match(/^\s*/)[0].length;
        const x = indent * CHAR_W + 2;
        const barW = Math.max(lineLen * CHAR_W, 2);
        ctx.fillRect(x, y, Math.min(barW, halfW - x - 2), Math.max(scale - 0.5, 1));
      }
    });

    // Draw right half
    rightLines.forEach((line, idx) => {
      const num = idx + 1;
      const y = idx * scale;
      const inf = lastRightInfo[num];
      const lineLen = Math.min(line.length, 60);

      if (inf && inf.type === 'add') {
        ctx.fillStyle = ADD_BG_MM;
        ctx.fillRect(halfW, y, halfW, Math.max(scale, 1));
        ctx.fillStyle = ADD_COLOR;
      } else {
        ctx.fillStyle = CODE_COLOR;
      }

      if (lineLen > 0) {
        const indent = line.match(/^\s*/)[0].length;
        const x = halfW + indent * CHAR_W + 2;
        const barW = Math.max(lineLen * CHAR_W, 2);
        ctx.fillRect(x, y, Math.min(barW, w - x - 2), Math.max(scale - 0.5, 1));
      }
    });
  }

  function updateMinimapViewport() {
    // Use left scroll as reference (they're synced)
    const totalH = leftScroll.scrollHeight;
    const visibleH = leftScroll.clientHeight;
    const mapH = minimapEl.getBoundingClientRect().height;
    if (totalH <= 0) return;

    const ratio = mapH / totalH;
    const vpTop = leftScroll.scrollTop * ratio;
    const vpHeight = Math.max(visibleH * ratio, 12);
    minimapVP.style.top = vpTop + 'px';
    minimapVP.style.height = vpHeight + 'px';
  }

  function updateMinimaps() {
    renderMinimap();
    updateMinimapViewport();
  }

  // Click/drag on minimap to scroll both panes
  (function() {
    function scrollToY(clientY) {
      const rect = minimapEl.getBoundingClientRect();
      const ratio = (clientY - rect.top) / rect.height;
      const targetScroll = ratio * leftScroll.scrollHeight - leftScroll.clientHeight / 2;
      leftScroll.scrollTop = Math.max(0, targetScroll);
    }

    let dragging = false;
    minimapEl.addEventListener('mousedown', e => {
      e.preventDefault();
      dragging = true;
      scrollToY(e.clientY);
    });
    window.addEventListener('mousemove', e => {
      if (dragging) {
        e.preventDefault();
        scrollToY(e.clientY);
      }
    });
    window.addEventListener('mouseup', () => { dragging = false; });
  })();

  // Update viewport indicator on scroll
  leftScroll.addEventListener('scroll', updateMinimapViewport);
  rightScroll.addEventListener('scroll', updateMinimapViewport);

  leftInput.addEventListener('input', scheduleCompare);
  rightInput.addEventListener('input', scheduleCompare);
  langSelect.addEventListener('change', compare);
  window.addEventListener('resize', () => { fitTextareas(); updateMinimaps(); });
</script>
</body>
</html>
